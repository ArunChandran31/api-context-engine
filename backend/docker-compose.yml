services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-context-engine:dev
    container_name: api-context-engine-dev
    ports:
      - "8000:8000"
    environment:
        HOST: "0.0.0.0"
        PORT: "8000"
        DATABASE_URL: "sqlite:////app/data/db/api_context_engine.db"
        REDIS_URL: "redis://redis:6379/0"
        REDIS_CACHE_TTL_SECONDS: "300"
        RAG_VECTOR_STORE_PATH: "/app/data/faiss"
        LLM_PROVIDER: "${LLM_PROVIDER:-deterministic}"
        GROQ_API_KEY: "${GROQ_API_KEY:-}"
        GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
    volumes:
      - api_context_engine_db:/app/data/db
      - api_context_engine_faiss:/app/data/faiss
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: api-context-engine-redis
    restart: unless-stopped

volumes:
  api_context_engine_db:
  api_context_engine_faiss:
