services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-context-engine:dev
    container_name: api-context-engine-dev
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "sqlite:////app/data/db/api_context_engine.db"
      RAG_VECTOR_STORE_PATH: "/app/data/faiss"
      LLM_PROVIDER: "deterministic"
    volumes:
      - api_context_engine_db:/app/data/db
      - api_context_engine_faiss:/app/data/faiss
    restart: unless-stopped

volumes:
  api_context_engine_db:
  api_context_engine_faiss:
